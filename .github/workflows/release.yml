name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Releases must not overlap: a cancelled run can leave a tag without its npm
# publish, so queue pushes instead of cancelling them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token is used instead of GITHUB_TOKEN so that the release
      # PR and tag it pushes trigger the repository's other workflows.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm trusted publishing: the OIDC token replaces NPM_TOKEN.
      id-token: write
    env:
      npm_config_engine_strict: "true"
      npm_config_strict_peer_deps: "true"
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Set up Node.js for the quality gates
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run typecheck
      # Trusted publishing needs a newer npm than Node 22 ships, and that npm
      # requires Node 24.
      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm to a trusted-publishing capable release
        run: npm install --global npm@^11.5.1
      - name: Publish to npm
        run: npm publish
